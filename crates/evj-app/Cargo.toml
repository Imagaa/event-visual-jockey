[package]
name = "evj-app"
edition.workspace = true
version.workspace = true

[[bin]]
name = "evj"
path = "src/main.rs"

[features]
ffmpeg = ["evj-media/ffmpeg"]

[dependencies]
anyhow.workspace = true
evj-audio = { path = "../evj-audio" }
evj-core = { path = "../evj-core" }
evj-media = { path = "../evj-media" }
evj-engine = { path = "../evj-engine" }
evj-render = { path = "../evj-render" }
egui = "0.35"
egui_dock = { version = "0.20", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui-winit = "0.35"
egui-directx11 = "0.13"
winit = "0.30.13"
windows = { workspace = true, features = [
  "Win32_Foundation", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Debug", "Win32_Storage_FileSystem",
  "Win32_System_Kernel", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Memory", "Win32_Security",
] }

[build-dependencies]
embed-resource = "3"
